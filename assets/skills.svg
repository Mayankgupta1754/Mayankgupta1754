<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="t d">
  <title id="t">Next-token probabilities for "Mayank is best at"</title>
  <desc id="d">Building LLM apps 0.29, multi-agent systems 0.23, RAG pipelines 0.18, data analysis 0.13, fine-tuning with LoRA 0.09, teaching it to others 0.08.</desc>
  <style>
