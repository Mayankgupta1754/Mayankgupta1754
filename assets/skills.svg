    .ink { fill: #EDE7FF; } .muted { fill: #9C93C2; }
    .bar { transform-box: fill-box; transform-origin: 0 50%; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both; }
    .num { opacity: 0; animation: fade .4s ease-out forwards; }
    .caret { animation: blink 1s steps(1) infinite; }
    .chip { opacity: 0; animation: fade .4s ease-out 2.4s forwards; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .num, .chip { opacity: 1; } }
  </style>
